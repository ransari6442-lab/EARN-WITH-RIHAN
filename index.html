<script>

/* ==========================================
   4 SECOND COUNTDOWN + AUTO REDIRECT
   ========================================== */

const telegramLink =
    "https://t.me/+uL2bs041VKFmNDU1";

let time = 4;

const timer = document.getElementById("timer");

const countdown = setInterval(function(){

    timer.textContent =
        "00:" + (time < 10 ? "0" : "") + time;

    if(time <= 0){

        clearInterval(countdown);

        window.location.href = telegramLink;

        return;

    time--;

},1000);
